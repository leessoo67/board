<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"> <!--이걸 사용해야 th 사용 가능-->
<head>
    <meta charset="UTF-8">
    <title>게시글 상세 페이지</title>
</head>
<body>
<h1 th:text="${board.title}">제목입니다.</h1>
<p th:text="${board.content}">내용이 들어갈 부분입니다.</p>
<a th:href="@{/board/delete(id=${board.id})}">글삭제</a>
<!--글삭제 눌러도 반응없음-->
<a th:href="@{/board/modify/{id}(id = ${board.id})}">수정</a>
<!--여기에 데이터가 들어와야겠지 텍스트가 아니라.글마다 데이터가 다르게 넘어와야 하니까.-->
</body>
</html>

<!--글삭제는 view 상세페이지에서 설정 -->
<!--삭제 버튼 만들기-->
